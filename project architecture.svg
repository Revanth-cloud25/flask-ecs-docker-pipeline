<svg width="1300" height="780" viewBox="0 0 1300 780" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1300" height="780" fill="#ffffff"/>
  <text x="650" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1a1a">Flask App — Containerized CI/CD Pipeline on AWS</text>
  <text x="650" y="60" text-anchor="middle" font-size="12.5" fill="#666666">Code push → automated build &amp; deploy → live container → logs &amp; alerting</text>

  <!-- Zone labels -->
  <text x="140" y="95" text-anchor="middle" font-size="11" font-weight="600" fill="#888888" letter-spacing="0.5">LOCAL / CI ENVIRONMENT</text>
  <text x="1220" y="325" text-anchor="middle" font-size="11" font-weight="600" fill="#888888" letter-spacing="0.5">INTERNET</text>

  <!-- ============ LEFT COLUMN: Developer -> GitHub -> Jenkins ============ -->
  <g>
    <rect x="40" y="110" width="200" height="70" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
    <text x="140" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#26215C">Developer</text>
    <text x="140" y="158" text-anchor="middle" font-size="11" fill="#3C3489">git push</text>
  </g>
  <line x1="140" y1="180" x2="140" y2="213" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="40" y="215" width="200" height="70" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
    <text x="140" y="245" text-anchor="middle" font-size="13" font-weight="600" fill="#2C2C2A">GitHub repository</text>
    <text x="140" y="263" text-anchor="middle" font-size="11" fill="#444441">main branch</text>
  </g>
  <line x1="140" y1="285" x2="140" y2="318" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="40" y="320" width="200" height="100" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
    <text x="140" y="350" text-anchor="middle" font-size="13" font-weight="600" fill="#412402">Jenkins pipeline</text>
    <text x="140" y="368" text-anchor="middle" font-size="10.5" fill="#854F0B">Checkout → build → tag</text>
    <text x="140" y="383" text-anchor="middle" font-size="10.5" fill="#854F0B">→ push → deploy</text>
    <text x="140" y="401" text-anchor="middle" font-size="9.5" fill="#9c6a1a">reads Jenkinsfile from repo</text>
  </g>

  <!-- ============ AWS CLOUD BOUNDARY ============ -->
  <rect x="300" y="80" width="830" height="640" rx="18" fill="#F5F8FC" stroke="#8AA6C2" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="324" y="106" font-size="13.5" font-weight="700" fill="#2E4C6B">AWS Cloud — ap-south-1</text>

  <!-- ECR -->
  <g>
    <rect x="340" y="150" width="230" height="75" rx="10" fill="#EAF3DE" stroke="#639922" stroke-width="1"/>
    <text x="455" y="180" text-anchor="middle" font-size="13" font-weight="600" fill="#173404">Amazon ECR</text>
    <text x="455" y="198" text-anchor="middle" font-size="11" fill="#3B6D11">flask-ecs-app:latest</text>
  </g>

  <!-- ECS Cluster container -->
  <rect x="340" y="270" width="760" height="220" rx="14" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
  <text x="362" y="296" font-size="13" font-weight="600" fill="#4A1B0C">Amazon ECS Cluster (Fargate)</text>
  <text x="362" y="313" font-size="10.5" fill="#712B13">flask-ecs-cluster — serverless, no EC2 to manage</text>

  <g>
    <rect x="390" y="345" width="230" height="110" rx="10" fill="#F5C4B3" stroke="#993C1D" stroke-width="1"/>
    <text x="505" y="378" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4A1B0C">ECS service</text>
    <text x="505" y="396" text-anchor="middle" font-size="10.5" fill="#712B13">flask-ecs-service</text>
    <text x="505" y="412" text-anchor="middle" font-size="10.5" fill="#712B13">keeps desired count: 1</text>
  </g>

  <g>
    <rect x="660" y="345" width="230" height="110" rx="10" fill="#F5C4B3" stroke="#993C1D" stroke-width="1"/>
    <text x="775" y="378" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4A1B0C">Running task</text>
    <text x="775" y="396" text-anchor="middle" font-size="10.5" fill="#712B13">flask-container</text>
    <text x="775" y="412" text-anchor="middle" font-size="10.5" fill="#712B13">port 5000, public IP</text>
  </g>
  <line x1="620" y1="400" x2="658" y2="400" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="639" y="392" text-anchor="middle" font-size="9" fill="#555555">runs</text>

  <!-- CloudWatch Logs -->
  <g>
    <rect x="340" y="560" width="230" height="100" rx="10" fill="#FBEAF0" stroke="#D4537E" stroke-width="1"/>
    <text x="455" y="592" text-anchor="middle" font-size="13" font-weight="600" fill="#4B1528">CloudWatch logs</text>
    <text x="455" y="610" text-anchor="middle" font-size="10.5" fill="#993556">/ecs/flask-ecs-task</text>
    <text x="455" y="626" text-anchor="middle" font-size="10.5" fill="#993556">log group</text>
  </g>

  <!-- CloudWatch Alarm -->
  <g>
    <rect x="610" y="560" width="230" height="100" rx="10" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1"/>
    <text x="725" y="592" text-anchor="middle" font-size="13" font-weight="600" fill="#501313">CloudWatch alarm</text>
    <text x="725" y="610" text-anchor="middle" font-size="10.5" fill="#A32D2D">RunningTaskCount = 0</text>
    <text x="725" y="626" text-anchor="middle" font-size="10.5" fill="#A32D2D">flask-app-down-alarm</text>
  </g>

  <!-- SNS -->
  <g>
    <rect x="880" y="560" width="190" height="100" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
    <text x="975" y="592" text-anchor="middle" font-size="13" font-weight="600" fill="#412402">SNS topic</text>
    <text x="975" y="610" text-anchor="middle" font-size="10.5" fill="#854F0B">ecs-app-alerts</text>
    <text x="975" y="626" text-anchor="middle" font-size="10.5" fill="#854F0B">notifies subscribers</text>
  </g>

  <line x1="570" y1="610" x2="608" y2="610" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="840" y1="610" x2="878" y2="610" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ RIGHT COLUMN (external): Public user + Email ============ -->
  <g>
    <rect x="1150" y="345" width="140" height="90" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
    <text x="1220" y="378" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2C2C2A">Public user</text>
    <text x="1220" y="396" text-anchor="middle" font-size="10" fill="#444441">HTTP :5000</text>
  </g>

  <g>
    <rect x="1150" y="565" width="140" height="90" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="1"/>
    <text x="1220" y="598" text-anchor="middle" font-size="12.5" font-weight="600" fill="#042C53">Email alert</text>
    <text x="1220" y="616" text-anchor="middle" font-size="10" fill="#0C447C">ops notified</text>
  </g>

  <!-- ============ CROSS-ZONE ARROWS (drawn last, on top) ============ -->

  <!-- Jenkins -> ECR (push image) -->
  <path d="M240 350 C 290 350, 290 187, 338 187" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="252" y="235" font-size="9.5" fill="#555555">docker push</text>

  <!-- Jenkins -> ECS Service (deploy trigger, dashed) -->
  <path d="M240 400 C 300 400, 340 400, 388 400" fill="none" stroke="#555555" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="252" y="440" font-size="9.5" fill="#555555">aws ecs update-service</text>
  <text x="252" y="452" font-size="9.5" fill="#555555">--force-new-deployment</text>

  <!-- ECR -> ECS Service (pull image) -->
  <path d="M455 225 C 455 275, 490 275, 505 343" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="466" y="270" font-size="9.5" fill="#555555">pulls image</text>

  <!-- Public user -> Task -->
  <line x1="1150" y1="390" x2="892" y2="400" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1000" y="382" text-anchor="middle" font-size="9.5" fill="#555555">requests app</text>

  <!-- Task -> CloudWatch Logs -->
  <path d="M760 455 C 760 520, 550 520, 460 558" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="640" y="518" text-anchor="middle" font-size="9.5" fill="#555555">streams logs</text>

  <!-- SNS -> Email -->
  <path d="M1070 605 C 1110 605, 1110 610, 1148 610" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ LEGEND ============ -->
  <line x1="340" y1="740" x2="380" y2="740" stroke="#555555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="390" y="744" font-size="11" fill="#555555">build / data / traffic flow</text>

  <line x1="620" y1="740" x2="660" y2="740" stroke="#555555" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="670" y="744" font-size="11" fill="#555555">automated deployment trigger</text>
</svg>
